<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task & Expense Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-tasks fa-3x" style="color: #4e73df;"></i>
                <h2>TaskFlow</h2>
                <p>Task & Expense Management System</p>
            </div>
            <form id="loginForm">
                <div id="loginAlert"></div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </form>
            <div class="login-footer">
                <p class="mb-1"><strong>Admin Login:</strong></p>
                <small>admin@system.com / Admin@123</small>
                <p class="mt-2 mb-0"><small class="text-muted">Managers & Employees are created via the Admin panel after login.</small></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwd = document.getElementById('password');
            const icon = this.querySelector('i');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            const alertDiv = document.getElementById('loginAlert');

            btn.disabled = true;
            btnText.textContent = 'Signing In...';
            spinner.classList.remove('d-none');
            alertDiv.innerHTML = '';

            try {
                const result = await api.login(email, password);
                if (result.success) {
                    window.location.href = 'pages/dashboard.html';
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
                }
            } catch (error) {
                alertDiv.innerHTML = `<div class="alert alert-danger">${error.message || 'Login failed'}</div>`;
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.classList.add('d-none');
            }
        });

        if (api.isAuthenticated()) {
            window.location.href = 'pages/dashboard.html';
        }
    </script>
</body>
</html>
