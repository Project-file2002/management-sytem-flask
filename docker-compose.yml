services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      # mssql-tools18 is the correct path on the 2022-latest image
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" -C"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DB_SERVER: db
      DB_DATABASE: TaskExpenseDB
      DB_USERNAME: sa
      DB_PASSWORD: "YourStrong!Passw0rd"
      DB_TRUSTED: "no"
      DB_DRIVER: "{ODBC Driver 18 for SQL Server}"
      DB_ENCRYPT: "no"
      DB_TRUST_SERVER_CERT: "yes"
      HOST: "0.0.0.0"
      PORT: "5000"
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend

volumes:
  db_data:
